<body>

    "title": "Mantenimiento de equipo de izaje y guinche",

    "generalFields": [

          {"key": "engrase_devanador", "label": "Engrase devanador", "type": "text"},
          {"key": "observaciones", "label": "Observaciones", "type": "textarea"},
          {"key": "firma_aclaracion", "label": "Firma y aclaración", "type": "text"}

      }
    ],
    "finalFields": [],
    "notes": [],
    "observationsLabel": "Observaciones generales"
