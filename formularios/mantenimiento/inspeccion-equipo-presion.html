  "generalFields": [
    {"key": "fecha", "label": "Fecha", "type": "date", "required": true},
    {"key": "equipo", "label": "Equipo", "type": "text", "required": true},
    {"key": "ubicacion", "label": "Ubicación", "type": "text", "required": true},
    {"key": "operador", "label": "Operador", "type": "text", "required": true},
    {"key": "ayudante", "label": "Ayudante", "type": "text", "required": false},
    {"key": "supervisor", "label": "Supervisor", "type": "text", "required": false}

  "sections": [
    {
      "key": "elementos", "title": "Elementos", "type": "checklist", "itemLabel": "Elemento",

      "rows": [
        {"key": "riesgos-epp", "label": "Antes de comenzar el control realizar análisis de riesgos. Utilizar todos los EPP correspondientes a los riesgos de la tarea."},
        {"key": "limpieza", "label": "Limpiar todos los elementos con agua a presión / detergente industrial."},
        {"key": "roscas-uniones-poleas", "label": "Revisar que las roscas, uniones y poleas no presenten signos de desgaste ni rotura. En caso contrario reemplazar elementos."},

        {"key": "residuos", "label": "Asegurarse de eliminar cualquier residuo de los componentes antes del montaje."},
        {"key": "adecuacion", "label": "Revisar junto al responsable de mantenimiento que todos los componentes sean adecuados para su propósito."},

        {"key": "no-conforme", "label": "Si el equipo no pasa la inspección visual, o las piezas para reemplazar no están disponibles, registrar en POSN01-F3 y etiquetar en rojo con ‘No conforme’. Comunique a supervisión."},
        {"key": "lubricante", "label": "Aplicar una ligera capa de lubricante a todas las superficies."},
        {"key": "ensamblaje", "label": "Vuelva a ensamblar de forma correcta, revisando la hoja técnica del equipo."},
        {"key": "ajuste", "label": "Ajustar todos los componentes siguiendo los procedimientos de trabajo."},
        {"key": "orden", "label": "Asegurar un correcto orden y presentación durante el armado."}
      ]
    },
    {
      "key": "funcionamiento", "title": "Funcionamiento", "type": "checklist", "itemLabel": "Verificación",

        {"key": "manguera", "label": "Conectar la manguera hidráulica de la bomba manual a la tuerca del prensa."},
