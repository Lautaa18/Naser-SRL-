services:
  db:
    image: mariadb:11
    container_name: naser_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-naser_sgi_prueba}
      MARIADB_USER: ${DB_USER:-naser}
      MARIADB_PASSWORD: ${DB_PASS:-naser2026}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-root2026}
    volumes:
      - naser_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: naser_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-naser_sgi_prueba}
      DB_USER: ${DB_USER:-naser}
      DB_PASS: ${DB_PASS:-naser2026}
      APP_BASE: ${APP_BASE:-}
      APP_ENV: ${APP_ENV:-dev}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Mails: en desarrollo van a Mailpit (http://localhost:8025). En produccion poner el SMTP real en .env
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-sgi@gruponaser.com.ar}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NASER SGI}
    volumes:
      - ./:/var/www/html
      - ./naser.ini:/usr/local/etc/php/conf.d/zz-naser.ini:ro
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: naser_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASS:-root2026}
    depends_on:
      db:
        condition: service_healthy

  # Bandeja de mails de prueba: todos los mails que manda el sistema se ven en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: naser_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # Acceso desde internet con HTTPS (Cloudflare Tunnel). No abre puertos en el router.
  # Se activa solo cuando en .env esta TUNNEL_TOKEN:  docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: naser_tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

  # HTTPS publico con certificado automatico (Let's Encrypt). Atiende los puertos 80 y 443.
  # Se activa con:  docker compose --profile https up -d
  # En el router: 80 -> 80 y 443 -> 443 hacia este servidor. El 8080 queda solo para la red interna.
  caddy:
    image: caddy:2
    container_name: naser_caddy
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-sgi.gruponaser.com.ar}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - naser_caddy_data:/data
      - naser_caddy_config:/config
    depends_on:
      - web

  # Copias de seguridad automaticas: base de datos todos los dias y uploads los domingos (en ./backups)
  backup:
    image: mariadb:11
    container_name: naser_backup
    restart: unless-stopped
    entrypoint: ["bash", "/backup.sh"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-naser_sgi_prueba}
      DB_ROOT_PASS: ${DB_ROOT_PASS:-root2026}
      BACKUP_HORA: ${BACKUP_HORA:-2}
      BACKUP_DIAS: ${BACKUP_DIAS:-7}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./backups:/backups
      - ./uploads:/uploads:ro
      - ./docker/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  naser_db_data:
  naser_caddy_data:
  naser_caddy_config:
