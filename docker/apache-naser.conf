# Configuracion de Apache para NASER SGI
# Permite que funcionen los .htaccess del proyecto (raiz y uploads/)
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# No mostrar version de Apache/PHP
ServerTokens Prod
ServerSignature Off

# ---- Velocidad: compresion y cache del navegador ----
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml application/javascript application/json image/svg+xml
</IfModule>
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/png "access plus 7 days"
    ExpiresByType image/jpeg "access plus 7 days"
    ExpiresByType image/svg+xml "access plus 7 days"
    ExpiresByType image/x-icon "access plus 7 days"
    ExpiresByType font/woff2 "access plus 30 days"
</IfModule>
<IfModule mod_headers.c>
    # CSS y JS se piden con ?v=<fecha del archivo>: cada cambio genera otra URL, asi que se pueden guardar un año
    <If "%{QUERY_STRING} =~ /^v=[0-9]+$/ && %{REQUEST_URI} =~ /\.(css|js)$/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </If>
</IfModule>
